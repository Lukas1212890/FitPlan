name: Finalize FitPlan logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-transparent-logo.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply transparent logo and clean migration files
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('app/page.tsx')
          text = page.read_text()
          old = 'function Brand(){return <div className="brand"><span><img src="/fitplan-icon-v2.png" alt=""/></span>FITPLAN</div>}'
          new = 'function Brand(){return <div className="brand"><span><img src="/fitplan-logo.png" alt=""/></span>FITPLAN</div>}'
          if old not in text:
              raise SystemExit('Expected Brand markup not found')
          page.write_text(text.replace(old, new, 1))

          css = Path('app/globals.css')
          text = css.read_text()
          old = '.brand span { display:grid; place-items:center; width:38px; height:38px; border-radius:11px; background:var(--ink); overflow:hidden; letter-spacing:0; }.brand img { width:38px; height:38px; object-fit:cover; display:block; }'
          new = '.brand span { display:grid; place-items:center; width:38px; height:38px; background:transparent; letter-spacing:0; }.brand img { width:38px; height:38px; object-fit:contain; display:block; }'
          if old not in text:
              raise SystemExit('Expected brand CSS not found')
          css.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/import-fitplan.yml
          rm -f .github/workflows/migrate-from-gitlab.yml
          rm -f .github/workflows/trigger-migration.yml
          rm -f .github/workflows/apply-transparent-logo.yml

          git config user.name "FitPlan Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Use transparent FitPlan logo"
          git push origin main
