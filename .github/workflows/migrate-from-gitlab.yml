name: Migrate FitPlan from GitLab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone FitPlan from private GitLab repository
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          test -n "$GITLAB_TOKEN" || (echo "Missing GITLAB_TOKEN repository secret" && exit 1)
          git clone --depth 1 "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Lukas1212890/fitplan.git" /tmp/fitplan-gitlab

      - name: Copy project files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git' --exclude='.github' /tmp/fitplan-gitlab/ ./

      - name: Commit migrated project
        run: |
          git config user.name "FitPlan Migration"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "Migrate FitPlan from GitLab"
            git push origin main
          fi
